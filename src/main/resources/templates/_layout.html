<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE - TrendyShop">TrendyShop</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-light: #6366f1;
            --secondary-color: #ec4899;
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Premium Navbar */
        .navbar-custom {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.95) 0%, rgba(236, 72, 153, 0.95) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: #ffffff !important;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .navbar-brand i { 
            background: rgba(255,255,255,0.2); 
            padding: 0.4rem 0.5rem; 
            border-radius: 10px; 
            font-size: 1.25rem; 
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link:hover, .nav-link.active {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .search-wrapper { position: relative; }
        .search-input {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 99px;
            padding: 0.5rem 1.25rem 0.5rem 2.5rem;
            width: 300px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .search-input::placeholder { color: rgba(255, 255, 255, 0.6); }
        .search-input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.1);
            outline: none;
            width: 350px;
        }
        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }

        /* Layout */
        .main-content {
            flex: 1;
            padding: 2.5rem 0;
            animation: fadeUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Premium Buttons */
        .btn {
            font-weight: 500;
            border-radius: 10px;
            padding: 0.625rem 1.25rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: var(--primary-color);
            border: none;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-light);
            box-shadow: 0 8px 15px -3px rgba(79, 70, 229, 0.4);
            transform: translateY(-2px);
            color: #fff;
        }

        /* Cards & Surfaces */
        .glass-card {
            background: var(--surface-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Footer */
        .footer {
            background: var(--surface-color);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .navbar-nav { gap: 0.5rem; list-style: none; }
        .collapse.show .navbar-nav { margin-top: 1rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid px-4 px-lg-5">
            <a class="navbar-brand" th:href="@{/products}">
                <i class="fa-solid fa-store"></i> <span class="fw-bold">TrendyShop</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <i class="fa-solid fa-bars text-white fs-4"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/products}">
                            <i class="fa-solid fa-house"></i> Trang chủ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/products/create}">
                            <i class="fa-solid fa-plus-circle"></i> Thêm sản phẩm
                        </a>
                    </li>
                </ul>
                <form class="d-flex align-items-center mt-3 mt-lg-0" role="search" th:action="@{/products}" th:method="get">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input class="form-control search-input" type="search" name="q" placeholder="Tìm kiếm sản phẩm..." autocomplete="off"/>
                    </div>
                </form>
            </div>
        </div>
    </nav>

    <main layout:fragment="content" class="main-content px-4 px-lg-5">
        <!-- Content injects here -->
    </main>

    <footer class="footer mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 - Modern E-Commerce Application Built with J2EE & Spring Boot</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
