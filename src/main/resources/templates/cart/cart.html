<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Giỏ hàng</title>
</head>
<body>
    <div layout:fragment="content" class="container body-content px-3">
        <div class="frame-page mb-4">
            <div class="frame-header d-flex align-items-center gap-3 mb-3">
                <a th:href="@{/products}" class="btn btn-light rounded-circle text-muted p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="frame-title mb-0">Giỏ hàng</h1>
            </div>

            <div class="alert alert-danger border-0" th:if="${checkoutError != null}" th:text="${checkoutError}"></div>

            <div th:if="${cartEmpty}" class="text-center py-5 text-muted">
                <i class="fa-solid fa-cart-shopping fs-1 opacity-25 mb-3 d-block"></i>
                <p class="mb-4">Giỏ hàng của bạn đang trống.</p>
                <a th:href="@{/products}" class="btn btn-primary rounded-pill px-4">Xem sản phẩm</a>
            </div>

            <div th:unless="${cartEmpty}" class="frame-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Sản phẩm</th>
                                <th>Đơn giá (VNĐ)</th>
                                <th>Số lượng</th>
                                <th>Thành tiền (VNĐ)</th>
                                <th class="pe-4 text-end" style="width: 120px;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded overflow-hidden bg-light flex-shrink-0" style="width: 56px; height: 56px;">
                                            <img th:if="${item.image}" th:src="@{/images/{n}(n=${item.image})}" class="w-100 h-100" style="object-fit: cover;" alt=""/>
                                            <div th:unless="${item.image}" class="w-100 h-100 d-flex align-items-center justify-content-center text-secondary small">—</div>
                                        </div>
                                        <span class="fw-semibold" th:text="${item.name}"></span>
                                    </div>
                                </td>
                                <td><span th:text="${#numbers.formatInteger(item.unitPrice, 3, 'POINT')}"></span> ₫</td>
                                <td>
                                    <form class="d-flex align-items-center gap-2" th:action="@{/cart/update}" method="post">
                                        <input type="hidden" name="productId" th:value="${item.productId}"/>
                                        <input type="number" class="form-control form-control-sm" name="quantity" th:value="${item.quantity}" min="1" style="width: 5rem;"/>
                                        <button type="submit" class="btn btn-sm btn-outline-primary">Cập nhật</button>
                                    </form>
                                </td>
                                <td class="fw-bold text-success"><span th:text="${#numbers.formatInteger(item.lineTotal, 3, 'POINT')}"></span> ₫</td>
                                <td class="pe-4 text-end">
                                    <form th:action="@{/cart/remove}" method="post" class="d-inline">
                                        <input type="hidden" name="productId" th:value="${item.productId}"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="table-light">
                                <td colspan="3" class="ps-4 text-end fw-bold">Tổng tiền</td>
                                <td colspan="2" class="fw-bold text-success fs-5">
                                    <span th:text="${#numbers.formatInteger(grandTotal, 3, 'POINT')}"></span> ₫
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="p-4 border-top d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <a th:href="@{/products}" class="btn btn-outline-secondary rounded-pill">Tiếp tục mua</a>
                    <form th:action="@{/checkout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">
                            <i class="fa-solid fa-bag-shopping me-2"></i> Đặt hàng
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
