<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Đặt hàng thành công</title>
</head>
<body>
    <div layout:fragment="content" class="container body-content px-3" style="max-width: 560px;">
        <div class="frame-page text-center py-5">
            <div class="mb-4 text-success">
                <i class="fa-solid fa-circle-check" style="font-size: 4rem;"></i>
            </div>
            <h1 class="frame-title mb-3">Đặt hàng thành công</h1>
            <p class="text-muted mb-2">Mã đơn hàng: <strong class="text-dark" th:text="${orderId}">—</strong></p>
            <p class="text-muted mb-4">Tổng thanh toán:
                <strong class="text-success fs-5"><span th:text="${#numbers.formatInteger(orderTotal, 3, 'POINT')}"></span> ₫</strong>
            </p>
            <a th:href="@{/products}" class="btn btn-primary rounded-pill px-4">Về danh sách sản phẩm</a>
        </div>
    </div>
</body>
</html>
